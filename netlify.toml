[build]
  command = "cd server && npm install && cd .. && npm --prefix client install && npm --prefix client run build"
  publish = "client/build"
  functions = "netlify/functions"

[build.environment]
  NODE_OPTIONS = "--max_old_space_size=4096"
  CI = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "socket.io", "bcryptjs", "jsonwebtoken", "multer", "cors"]
